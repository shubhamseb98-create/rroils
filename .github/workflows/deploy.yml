name: Deploy to Testing and Main Live Servers

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual one-click deployment from GitHub UI

jobs:
  deploy-testing:
    name: 🧪 Deploy to Testing Server (seotycoons.in/rroil)
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🚀 Sync files to testing server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/*.zip
            **/*.sql
            **/error_log
            **/.DS_Store
            **/Thumbs.db

  deploy-production:
    name: 🌐 Deploy to Main Live Server
    runs-on: ubuntu-latest
    # Automatically runs when PROD_FTP_SERVER secret is provided in GitHub repository
    if: ${{ secrets.PROD_FTP_SERVER != '' }}
    steps:
      - name: 🚚 Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🚀 Sync files to main live server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PROD_FTP_SERVER }}
          username: ${{ secrets.PROD_FTP_USERNAME }}
          password: ${{ secrets.PROD_FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          server-dir: ${{ secrets.PROD_FTP_SERVER_DIR || 'public_html/move/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/*.zip
            **/*.sql
            **/error_log
            **/.DS_Store
            **/Thumbs.db

